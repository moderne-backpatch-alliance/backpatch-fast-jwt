  - cve: CVE-2026-35041
    upstream_fix_url: https://github.com/nearform/fast-jwt/commit/b0be0ca161593836a153d5180ca5358ad9b5de94
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-35041
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-fast-jwt/commit/d4d4657
    basis: adapted
    artifacts:
      - fast-jwt
    note: "Carried from 5.0.7-backpatch-00010; upstream's fix in 6.2.1, adapted to 5.0.6. It closes the advisory: fast-jwt has a ReDoS when using RegExp in allowed* leading to CPU exhaustion during token verification. This release adds a new runtime dependency, as upstream's fix does: package.json now requires safe-regex2 ^5.1.0, so installing it pulls safe-regex2 and its dependency ret from the registry, which offline mirrors and strict allow lists must carry. The verifier uses it to warn when an allowed* option holds a RegExp that safe-regex2 flags as unsafe."
  - cve: CVE-2026-35041
    upstream_fix_url: https://github.com/nearform/fast-jwt/commit/b0be0ca161593836a153d5180ca5358ad9b5de94
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-35041
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-fast-jwt/compare/55ab2d3~1...8ad095c
    basis: adapted
    artifacts:
      - fast-jwt
    note: "New in this release; completes upstream's fix in 6.2.1 (b0be0ca1), adapted to 5.0.6. It adds the isRegExpLike check of upstream's cross-realm repair in 6.3.3 (8ab97d3c), so an unsafe RegExp from another realm also gets the warning, where 5.0.7-backpatch-00010 checked instanceof RegExp. It also runs the checks before the allowedCritHeaders validation, where upstream's fix puts them, so a configuration that validation rejects still gets the warning first. It closes the advisory: fast-jwt has a ReDoS when using RegExp in allowed* leading to CPU exhaustion during token verification. This release adds a new runtime dependency, as upstream's fix does: package.json now requires safe-regex2 ^5.1.0, so installing it pulls safe-regex2 and its dependency ret from the registry, which offline mirrors and strict allow lists must carry. The verifier uses it to warn when an allowed* option holds a RegExp that safe-regex2 flags as unsafe."
